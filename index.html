let index=0, answers={};
const letters=['A','B','C','D'];
const $=id=>document.getElementById(id);
function render(){
  $('counter').textContent=`Question ${index+1} / ${questions.length}`;
  $('score').textContent=`Score: ${Object.keys(answers).filter(k=>answers[k]===questions[k].answer).length}`;
  $('answered').textContent=`Answered: ${Object.keys(answers).length}`;
  $('bar').style.width=`${Object.keys(answers).length/questions.length*100}%`;
  $('question').textContent=`${index+1}. ${questions[index].q}`;
  $('options').innerHTML='';
  const q=questions[index];
  q.options.forEach((opt,i)=>{
    const b=document.createElement('button'); b.className='option'; b.textContent=`${letters[i]}. ${opt}`;
    b.onclick=()=>choose(i); 
    if(answers[index]!==undefined){b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===answers[index]&&i!==q.answer)b.classList.add('wrong');}
    $('options').appendChild(b);
  });
  const f=$('feedback'); f.className='feedback'; f.textContent='';
  if(answers[index]!==undefined){
    const correct=answers[index]===q.answer;
    f.classList.add(correct?'ok':'no');
    f.append(document.createTextNode(correct?'Correct ✓':'Incorrect ✗ — Correct answer: '+letters[q.answer]+'. '+q.options[q.answer]));
    const e=document.createElement('div');e.className='explanation';e.textContent=q.explanation;f.appendChild(e);
  }
  $('prev').disabled=index===0;
  $('next').textContent=index===questions.length-1?'Finish exam':'Next question';
}
function choose(i){if(answers[index]!==undefined)return;answers[index]=i;render();}
$('prev').onclick=()=>{if(index>0){index--;render();}};
$('next').onclick=()=>{if(index<questions.length-1){index++;render();}else finish();};
function finish(){
 $('quiz').classList.add('hidden');$('results').classList.remove('hidden');
 const score=Object.keys(answers).filter(k=>answers[k]===questions[k].answer).length;
 $('finalScore').textContent=`Your score: ${score} / ${questions.length}`;
 $('finalDetail').textContent=`You answered ${Object.keys(answers).length} of ${questions.length} questions. You can review each answer or restart the exam.`;
}
$('review').onclick=()=>{$('results').classList.add('hidden');$('quiz').classList.remove('hidden');index=0;render();};
$('restart').onclick=()=>{answers={};index=0;$('results').classList.add('hidden');$('quiz').classList.remove('hidden');render();};
render();
</script></body></html>
